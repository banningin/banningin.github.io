    <style>
        /* Modern Glassmorphism & Aurora Theme */
        :root {
            --bg-dark: #0a0a0f;
            --aurora-1: #6366f1;
            --aurora-2: #a855f7;
            --aurora-3: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --radius-lg: 24px;
            --radius-full: 9999px;
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Background Orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.4;
            animation: float 20s infinite alternate ease-in-out;
        }

        body::before {
            top: -10vw;
            left: -10vw;
            background: radial-gradient(circle, var(--aurora-1), transparent 70%);
        }

        body::after {
            bottom: -20vw;
            right: -10vw;
            background: radial-gradient(circle, var(--aurora-3), var(--aurora-2), transparent 70%);
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5vw, 5vw) scale(1.1); }
        }

        h1, h2, h3, h4, .username {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Top Navigation */
        .top-nav {
            padding: 20px 0;
            text-align: center;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .top-nav a {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            padding: 10px 24px;
            text-decoration: none;
            transition: var(--transition-smooth);
            cursor: pointer;
            border-radius: var(--radius-full);
            background: transparent;
            border: 1px solid transparent;
        }

        .top-nav a:hover, .top-nav a.active {
            color: var(--text-main);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* Header */
        header {
            padding: 100px 0 60px;
            text-align: center;
            animation: fadeDown 1s ease-out forwards;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header h1 {
            margin: 0;
            font-size: 4.5rem;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #fff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: var(--transition-smooth);
            text-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
        }

        header h1:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        header p {
            margin: 20px auto 0;
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 400;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            display: inline-block;
            padding: 8px 32px;
            border-radius: var(--radius-full);
            backdrop-filter: blur(10px);
        }

        /* Post Cards */
        .post-card, .single-post {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-radius: var(--radius-lg);
            margin-bottom: 40px;
            overflow: hidden;
            transition: var(--transition-smooth);
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .post-card:hover {
            transform: translateY(-8px);
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 40px rgba(168, 85, 247, 0.1);
        }

        .single-post {
            cursor: default;
        }

        .post-header {
            padding: 24px 32px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .post-header img.avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-right: 16px;
            padding: 2px;
            background: linear-gradient(135deg, var(--aurora-1), var(--aurora-3));
            object-fit: cover;
        }

        .post-header .username {
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .post-image {
            width: 100%;
            display: block;
            max-height: 480px;
            object-fit: cover;
        }

        .post-content {
            padding: 40px 32px;
        }

        .post-content h1, .post-content h2 {
            margin: 0 0 16px;
            font-size: 2.2rem;
            line-height: 1.2;
        }

        .post-content p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 0;
        }

        .post-footer {
            padding: 20px 32px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(0, 0, 0, 0.2);
        }

        .post-footer span:last-child {
            font-size: 1.2rem;
            letter-spacing: 12px;
            opacity: 0.7;
        }

        /* Single Post Overrides */
        .single-post .post-image {
            max-height: 600px;
        }
        .single-post .post-content p {
            margin-bottom: 24px;
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 32px;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            transition: var(--transition-smooth);
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Generated Content Styling Overrides */
        .post-content h2 {
            color: #fff !important;
            border-bottom: 1px solid var(--glass-border) !important;
            font-size: 2rem !important;
            margin-top: 48px !important;
        }
        .post-content h3 {
            color: #e2e8f0 !important;
            border-left-color: var(--aurora-1) !important;
        }
        .post-content h4 {
            background: rgba(255,255,255,0.03) !important;
            color: #f8fafc !important;
        }
        .post-content div[style*="background"] {
            background: rgba(255, 255, 255, 0.02) !important;
            border-color: var(--glass-border) !important;
            backdrop-filter: blur(10px) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1) !important;
        }
        .post-content p[style*="background"] {
            background: rgba(99, 102, 241, 0.1) !important;
            border-color: var(--aurora-1) !important;
            color: #f8fafc !important;
        }
        .post-content span[style*="background"] {
            background: rgba(168, 85, 247, 0.15) !important;
            color: #f8fafc !important;
            border: 1px solid rgba(168, 85, 247, 0.3) !important;
        }

    <script>
        // 1. Define your blog posts here!
        const posts = [
            {
                id: 'the-first-post',
                title: 'Nautical Macramé Anchor Wall Hanging',
                date: 'March 18, 2026',
                image: './assets/Macrame Anchor Wall Hanging.png',
                excerpt: `Bring the coast indoors with a navy and cream macramé anchor that turns knots into pure seaside charm. ⚓ This handwoven wall hanging pairs a braided anchor ring with soft cotton tassels for that laid-back beach-house feel, no shells required. Perfect above a console, in an entryway, or styled with driftwood and a little sailboat.

• Two-tone navy and natural cotton reads crisp and coastal 🌊
• Lightweight and easy to hang on a single hook

Ideal for nautical nurseries, beach cottages, and boho coastal corners. Save for later and pin it to your seaside décor board!`,
                content: `
                    <p>There is something about a nautical anchor that instantly slows the whole room down. It whispers of salt air, quiet harbors, and long summer afternoons, and when that anchor is rendered in soft cotton cord instead of cold metal, the effect is even more inviting. This navy and cream macramé anchor wall hanging takes a classic coastal symbol and reworks it into something tactile, handmade, and full of texture. If you have been searching for a way to bring beach-house energy into your space without leaning on obvious seashell clichés, this is the piece that does it with quiet confidence.</p>

                    <div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;">
                      <h3 style="margin-top:0;margin-bottom:12px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Key Takeaways</h3>
                      <ul style="margin:0;padding-left:20px;">
                        <li>A macramé anchor blends coastal charm with cozy boho texture in one piece.</li>
                        <li>The two-tone navy and natural palette keeps it crisp instead of kitschy.</li>
                        <li>It works far beyond the beach house, from nurseries to entryways.</li>
                        <li>Cotton cord makes it lightweight, soft, and easy to hang anywhere.</li>
                        <li>Simple styling with wood, greenery, and warm light makes it shine.</li>
                      </ul>
                    </div>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Why a Macramé Anchor Feels So Right for Coastal Décor</h2>
                    <p>Traditional nautical décor can tip into theme-park territory fast. Too many ropes, too many portholes, and a room starts to feel like a costume rather than a home. Macramé solves that problem beautifully. By translating the anchor shape into knotted cotton, you keep the meaning and lose the heavy-handedness. The result reads as artisan and collected rather than shouty and literal.</p>
                    <p>The navy cord anchors the design, quite literally, giving your eye a strong graphic shape to follow. The cream tassels and diamond knot patterns soften everything around it, so the piece feels handmade and warm. That balance between structure and softness is exactly what makes boho coastal style so appealing right now.</p>

                    <p style="background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;"><strong>Important:</strong> Coastal style works best when you commit to a restrained palette. Sticking to navy, cream, natural wood, and one accent green keeps the look intentional instead of cluttered.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">The Anatomy of This Anchor Wall Hanging</h2>
                    <p>Take a closer look and you will notice the piece is built from several distinct knotting zones, each doing its own job. Understanding these details helps whether you plan to buy one or knot your own.</p>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Anchor Ring</h3>
                    <p>At the top sits a tightly wrapped navy ring, formed by coiling cord around a base loop. This is the visual crown of the piece and the part that most clearly signals anchor. Wrapping knots like this take patience, but they give that satisfying, ribbed, rope-like finish.</p>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Wooden Stock and Crossbar</h3>
                    <p>A slim wooden dowel runs horizontally to form the anchor stock. The navy and cream cord wrapped around each end mimics the way a real anchor is bound, and it introduces a natural material that grounds all that soft cotton.</p>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Diamond Body</h3>
                    <p>The central shank is worked in a cream diamond lattice, a hallmark macramé pattern made from alternating square knots. It adds a delicate, woven quality that contrasts nicely with the bolder navy elements.</p>

                    <h4 style="font-size:20px;line-height:1.4;margin:22px 0 12px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;">The Flukes and Tassels</h4>
                    <p>The two arms sweeping outward end in navy tassels, while long cream fringe cascades down for movement. That fringe is what gives the piece its relaxed, breezy character, catching light and gently shifting when air moves through the room.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Where to Hang Your Macramé Anchor</h2>
                    <p>One of the best things about this piece is its versatility. It is unmistakably nautical, yet it is subtle enough to slip into many different rooms.</p>
                    <ul>
                        <li><strong>Entryways:</strong> Greet guests with instant coastal calm. Pair it with a wooden bench and a woven basket for shoes.</li>
                        <li><strong>Nurseries:</strong> A navy and cream anchor is a nursery classic that grows with the child, avoiding overly babyish motifs.</li>
                        <li><strong>Bathrooms:</strong> Bring spa-like seaside serenity above a towel rail or beside a mirror.</li>
                        <li><strong>Bedrooms:</strong> Hang it above a nightstand or dresser to echo linen bedding and driftwood tones.</li>
                        <li><strong>Home offices:</strong> A little coastal texture behind you looks wonderful on video calls.</li>
                    </ul>

                    <div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;">
                      <h3 style="margin-top:0;margin-bottom:12px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Why This Matters</h3>
                      <p style="margin:0;">Wall décor sets the emotional tone of a room before anyone reads a single label. A handmade anchor signals warmth, craft, and a relaxed pace, which is exactly the mood most people want their homes to hold.</p>
                    </div>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Styling Tips for a Collected Coastal Look</h2>
                    <p>To let the anchor breathe, surround it with a few complementary pieces rather than crowding it. Think of the wall as a small gallery where the anchor is the star.</p>
                    <p>Lean into natural materials nearby. A ceramic vase with a sprig of eucalyptus, a small wooden sailboat, a glass lantern with a warm candle, and a shallow dish of shells all support the story without competing with it. Framed beach prints in raw wood frames tie the palette together and give the eye somewhere restful to land.</p>

                    <p style="background:#fff7ed;border:1px solid #fed7aa;padding:16px 18px;border-radius:10px;margin:22px 0;color:#9a3412;"><strong>Pro Tip:</strong> Warm lighting transforms macramé. Position the anchor where lamplight or a candle can graze across the knots, and the texture will practically glow after sunset.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Caring for Cotton Macramé</h2>
                    <p>Cotton cord is forgiving, but a little care keeps your anchor looking fresh for years. Dust it gently with a soft brush or a hairdryer on the cool setting to lift away particles from the knots. Keep it out of harsh direct sunlight for long stretches, since strong rays can fade natural cotton over time. If a tassel loses its shape, a light misting of water and a gentle comb-through restores that neat, flowing drape.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Thinking of Making Your Own?</h2>
                    <p>If you love a hands-on project, an anchor is a rewarding intermediate macramé make. You will mostly rely on a handful of core knots, so it is very approachable once you have the basics.</p>
                    <ol>
                        <li>Gather natural and navy cotton cord in a medium thickness, plus a small wooden dowel and a metal or wooden ring for the top.</li>
                        <li>Practice square knots and half hitches until they feel automatic.</li>
                        <li>Build the ring first, then the crossbar, then work down through the diamond body.</li>
                        <li>Finish by shaping the flukes and trimming the fringe to a clean, even sweep.</li>
                    </ol>
                    <p>Do not stress about perfect symmetry. A little handmade character is part of the charm, and it is exactly what separates a warm, artisan piece from a mass-produced one.</p>

                    <div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;">
                      <h3 style="margin-top:0;margin-bottom:12px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">At a Glance</h3>
                      <ul style="margin:0;padding-left:20px;">
                        <li>Two-tone navy and cream cotton for crisp coastal contrast.</li>
                        <li>Combines wrapping knots, square knots, and half hitches.</li>
                        <li>Works in entryways, nurseries, baths, and bedrooms alike.</li>
                        <li>Best styled with wood, greenery, and warm light.</li>
                        <li>Beginner-friendly to buy, intermediate-level to make.</li>
                      </ul>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">A Timeless Anchor for Your Walls</h2>

                content: `
                    <p>Few motifs feel as universally warm as a heart, and when it is knotted by hand in soft natural cotton, it stops being a cliché and becomes something genuinely cozy. This boho macramé heart wall hanging features three hearts tumbling gently down a vertical panel, each finished with a flowing tassel. The effect is romantic without being sugary, handmade without being fussy, and it slips into almost any room thanks to its calm, neutral palette.</p>

                    <p>Hearts get a bad rap for being overly sentimental, but material changes everything. Rendered in glossy plastic, a heart can feel cheap. Knotted in raw cotton with a nubby, textured surface, that same shape becomes grounded and artful. The neutral tone keeps things subtle, so the piece reads as a considered design choice rather than a holiday leftover.</p>
                    <p>The cascading arrangement is what really elevates this design. Instead of a single static heart, three of them drift down at staggered heights, guiding your eye on a soft diagonal journey. That sense of movement makes the wall feel alive and intentional.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Breaking Down the Design</h2>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Wooden Hanging Bar</h3>
                    <p>A slim natural wood dowel forms the top support, with a simple cord loop for hanging. This raw wood element is a signature of boho style, adding an organic anchor to all the soft fringe below.</p>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Vertical Cord Panels</h3>
                    <p>From the dowel, long cords fall in neat vertical lines, some worked with small spiral knots for extra detail. These lines give the piece height and elegance, framing the hearts and drawing the eye downward.</p>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Knotted Hearts</h3>
                    <p>Each heart is shaped from tightly worked knots that curve and dip to form that instantly recognizable silhouette. The density of the knotting gives the hearts a lovely raised, sculptural quality against the flatter background cords.</p>

                    <p>This hanging plays beautifully with other natural textures. Set it near dried pampas grass, a couple of small potted succulents, and a stack of well-loved books, and you instantly create that warm, curated corner so many of us are drawn to. Keep the surrounding colors soft, creams, sandy beiges, muted greens, and let the wood tones tie everything together.</p>

                    <p style="background:#fff7ed;border:1px solid #fed7aa;padding:16px 18px;border-radius:10px;margin:22px 0;color:#9a3412;"><strong>Pro Tip:</strong> Hang it where natural daylight can rake across the surface. Side lighting reveals every knot and shadow, making the hearts look far more three dimensional than flat, straight-on light ever will.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">A Thoughtful Handmade Gift</h2>
                    <p>Because hearts carry such a warm message, this style of hanging makes a truly meaningful gift. It works for housewarmings, weddings, anniversaries, and of course Valentine's Day, but it never feels tied to a single occasion. Unlike flowers that fade or chocolates that vanish, a macramé heart stays on the wall as a lasting reminder of the person who gave it. That longevity is part of what makes handmade fiber art so special.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Want to Knot Your Own Hearts?</h2>

                        <li>Attach a tassel below, then trim it straight for a clean, tidy finish.</li>

                    <p>Most décor asks for space and gives back nothing but looks. A macramé shelf flips that deal. It takes up vertical wall real estate that would otherwise sit empty, and it hands you two functional surfaces in return. For renters, small-apartment dwellers, and anyone chasing a clutter-free look, that combination of beauty and utility is hard to beat.</p>

                    <p>Some pieces of décor make you smile the moment you see them, and this boho macramé owl is one of them. With its wide beady eyes, softly layered feathers in earthy terracotta, sage, and mustard, and a clever little pocket that cradles a real plant, it is equal parts fiber art and functional planter. It brings warmth, whimsy, and a touch of nature to any wall, and it does it with so much character that it instantly becomes a room's favorite detail.</p>

                    <div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;">
                      <h3 style="margin-top:0;margin-bottom:12px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Key Takeaways</h3>
                      <ul style="margin:0;padding-left:20px;">
                        <li>A macramé owl doubles as playful wall art and a mini planter.</li>
                        <li>Warm earthy tones add color without overwhelming a space.</li>
                        <li>The built-in pocket holds a small potted plant beautifully.</li>
                        <li>Beads, feathers, and a brass moon add rich detail.</li>
                        <li>It is a charming choice for nurseries and boho corners.</li>
                      </ul>
                    </div>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">The Owl That Doubles as a Planter</h2>
                    <p>Owls have long been symbols of wisdom, calm, and quiet watchfulness, which makes them a natural fit for a cozy home. This design takes that beloved motif and gives it a practical twist. Tucked into the owl's belly is a woven pocket sized for a small terracotta pot, so your feathered friend can hold a living succulent or trailing plant. It is a delightful surprise that transforms a decorative hanging into something you interact with and care for.</p>
                    <p>The color story is what sets this piece apart from the usual all-cream macramé. Feathers layered in rust, gold, and soft green give the owl depth and a gentle autumnal warmth, while the natural cotton base keeps it grounded. It is colorful without being loud, which is a tricky balance to strike.</p>

                    <p style="background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;"><strong>Important:</strong> Earthy, muted colors are the easiest way to add warmth to a neutral room without clashing. Terracotta, sage, and mustard all sit comfortably beside natural wood and cream cotton.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">All the Charming Details</h2>
                    <p>This owl is packed with thoughtful touches, and part of the joy is discovering them one by one.</p>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Expressive Eyes</h3>
                    <p>Two large round beads form the owl's eyes, framed by rings of knotted cord and swooping terracotta brows. This is where all the personality lives, giving the piece a friendly, alert expression.</p>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Layered Feather Wings</h3>
                    <p>The wings are built from overlapping bands of colored cord, mimicking real feathers. This layering technique adds gorgeous dimension and is a lovely showcase of skilled knotwork.</p>

                    <h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Plant Pocket and Brass Moon</h3>
                    <p>A woven net-style pocket sits at the belly to hold a small pot, accented with a tiny brass crescent moon charm. It is a magical, celestial touch that ties into boho and cottagecore aesthetics alike.</p>

                    <h4 style="font-size:20px;line-height:1.4;margin:22px 0 12px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;">The Beaded Tail Fringe</h4>
                    <p>The owl's tail flows into long fringe threaded with wooden beads in graduated sizes. This beaded detail adds rhythm and a satisfying finish, drawing the eye all the way to the bottom.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">The Best Plants for Your Owl Pocket</h2>
                    <p>Choosing the right plant keeps your owl happy and low maintenance. Lean toward small, hardy, and slow-growing varieties that do not need constant repotting.</p>
                    <ul>
                        <li><strong>Faux succulents:</strong> Zero care and always fresh, ideal if the spot gets little light.</li>
                        <li><strong>Live succulents:</strong> Compact and forgiving, perfect for a bright wall.</li>
                        <li><strong>Small pothos:</strong> A trailing vine that softens the owl's shape over time.</li>
                        <li><strong>Air plants:</strong> No soil needed, just an occasional misting or soak.</li>
                    </ul>

                    <div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;">
                      <h3 style="margin-top:0;margin-bottom:12px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Quick Note</h3>
                      <p style="margin:0;">If you choose a live plant, remove the pot to water it and let it drain fully before returning it to the pocket. This keeps moisture off the cotton cord and prevents staining or mildew.</p>
                    </div>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Styling the Owl in Your Space</h2>
                    <p>This piece has enough personality to stand alone, so give it a little breathing room. A clear stretch of neutral wall lets the colors and details pop. Flank it with a few trailing houseplants or a leafy branch in a vase, and the owl feels right at home in its natural setting. It is especially wonderful in a child's room, where the friendly face and playful shape spark imagination, but it is just as charming in a plant-filled living room or a cozy reading corner.</p>

                    <p style="background:#fff7ed;border:1px solid #fed7aa;padding:16px 18px;border-radius:10px;margin:22px 0;color:#9a3412;"><strong>Pro Tip:</strong> Hang the owl slightly above eye level so its big eyes gaze gently downward into the room. That small placement trick makes the whole piece feel more alive and welcoming.</p>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">A Meaningful, Whimsical Gift</h2>
                    <p>Because it blends nature, whimsy, and handmade craft, this owl makes a memorable gift. It suits plant lovers, new parents decorating a nursery, and anyone drawn to boho or nature-inspired interiors. Pair it with a tiny potted succulent and you have a complete, ready-to-hang present that feels personal and thoughtful. Gifts that combine beauty with a little function always land well, and a planter you can admire on the wall checks both boxes.</p>

                    <div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;">
                      <h3 style="margin-top:0;margin-bottom:12px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">At a Glance</h3>
                      <ul style="margin:0;padding-left:20px;">
                        <li>Playful owl design with a working plant pocket.</li>
                        <li>Warm terracotta, sage, and mustard color palette.</li>
                        <li>Beady eyes, layered feathers, and a brass moon charm.</li>
                        <li>Pairs best with small succulents or trailing plants.</li>
                        <li>A charming gift for plant lovers and nurseries.</li>
                      </ul>
                    </div>

                    <h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">A Wise Little Addition to Any Wall</h2>
                    <p>This boho macramé owl proves that home décor can be joyful. It combines the soft artistry of fiber work, the warmth of earthy color, and the living freshness of a real plant into one irresistibly charming piece. Whether it watches over a nursery, brightens a plant-filled corner, or lands as a thoughtful gift, it brings personality and a gentle sense of nature indoors. In a world of plain walls, a friendly knotted owl with a plant in its belly is exactly the kind of detail that makes a house feel like home.</p>

                    <div style="margin-top:28px;">
                      <h3 style="margin-bottom:12px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Tags</h3>
                      <span style="display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;">Macramé Owl</span>
                      <span style="display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;">Boho Décor</span>
                      <span style="display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;">Plant Holder</span>
                      <span style="display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;">Nursery Wall Art</span>
                      <span style="display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;">Fiber Art</span>
                      <span style="display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;">Cottagecore</span>
                      <span style="display:inline-block;background:#eef2f7;color:#1f2937;padding:6px 10px;border-radius:999px;margin:4px 6px 0 0;font-size:13px;">Handmade Planter</span>
                    </div>
                `
            },
        ];

        // Static Legal Pages
        const pages = {
            'about': {
                title: 'About Us',
                content: `
                    <p>Welcome to <strong>Organized Ambition</strong>!</p>
                    <p>Our mission is to create a positive, inspiring, and safe space on the internet where we share thoughts, stories, and ideas about web development, creative hobbies, and daily life.</p>
                    <p>Whether you are here to learn how to code, find creative inspiration, or just read some fun stories, we are glad you stopped by. We strive to provide high-quality, family-friendly content that sparks creativity and learning.</p>
                    <p>Thank you for being part of our community!</p>
                `
            },
            'privacy': {
                title: 'Privacy Policy',
                content: `
                    <p><strong>Last updated: May 2026</strong></p>
                    <p>At Organized Ambition, one of our main priorities is the privacy of our visitors. This Privacy Policy document contains types of information that is collected and recorded by us and how we use it.</p>
                    
                    <h3>Log Files</h3>
                    <p>We follow a standard procedure of using log files. The information collected includes internet protocol (IP) addresses, browser type, Internet Service Provider (ISP), date and time stamp, referring/exit pages, and possibly the number of clicks.</p>

                    <h3>Cookies and Web Beacons</h3>
                    <p>Like any other website, we use "cookies". These cookies are used to store information including visitors' preferences, and the pages on the website that the visitor accessed or visited.</p>
                `
            },
            'terms': {
                title: 'Terms of Service',
                content: `
                    <p><strong>Effective Date: May 2026</strong></p>
                    <h3>1. Acceptance of Terms</h3>
                    <p>By accessing and using this website, you accept and agree to be bound by the terms and provision of this agreement.</p>
                    
                    <h3>2. User Conduct</h3>
                    <p>Our blog is a family-friendly space. You agree to use the site only for lawful purposes.</p>
                `
            },
            'contact': {
                title: 'Contact Us',
                content: `
                    <p>We would love to hear from you! Whether you have a question about our content, need assistance with our website, or want to inquire about our Privacy Policy and Terms of Service, feel free to reach out.</p>
                    <p><strong>Email:</strong> <a href="mailto:contact@example.com" style="color: #a855f7;">contact@example.com</a></p>
                `
            }
        };

        const app = document.getElementById('app');
        const blogUsername = "Organized Ambition";
        const avatarUrl = "https://via.placeholder.com/100/a855f7/ffffff?text=OA";

        function renderHome() {
            let html = '';
            posts.forEach(post => {
                html += `
                    <div class="post-card" onclick="navigate('post', '${post.id}')">
                        <div class="post-header">
                            <img class="avatar" src="${avatarUrl}" alt="Avatar">
                            <span class="username">${blogUsername}</span>
                        </div>
                        <img class="post-image" src="${post.image}" alt="${post.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/800x480/1a1a24/a855f7?text=Image+Not+Found'">
                        <div class="post-content">
                            <h2>${post.title}</h2>
                            <p>${post.excerpt}</p>
                        </div>
                        <div class="post-footer">
                            <span>${post.date}</span>
                            <span>↻ ♥</span>
                        </div>
                    </div>
                `;
            });
            app.innerHTML = html;
        }

        function renderPage(pageId) {
            const page = pages[pageId];
            if (!page) {
                app.innerHTML = `<p style="color: white;">Page not found.</p><a class="back-button" onclick="navigate('home')">&larr; Back to Dashboard</a>`;
                return;
            }

            app.innerHTML = `
                <a class="back-button" onclick="navigate('home')">&larr; Back to Dashboard</a>
                <div class="single-post">
                    <div class="post-content">
                        <h1>${page.title}</h1>
                        ${page.content}
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        function renderPost(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) {
                app.innerHTML = `<p style="color: white;">Post not found.</p><a class="back-button" onclick="navigate('home')">&larr; Back to Dashboard</a>`;
                return;
            }

            app.innerHTML = `
                <a class="back-button" onclick="navigate('home')">&larr; Back to Dashboard</a>
                <div class="single-post">
                    <div class="post-header">
                        <img class="avatar" src="${avatarUrl}" alt="Avatar">
                        <span class="username">${blogUsername}</span>
                    </div>
                    <img class="post-image" src="${post.image}" alt="${post.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/800x480/1a1a24/a855f7?text=Image+Not+Found'">
                    <div class="post-content">
                        <h1>${post.title}</h1>
                        ${post.content}
                    </div>
                    <div class="post-footer">
                        <span>${post.date}</span>
                        <span>↻ ♥</span>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        function navigate(view, id = null) {
            if (view === 'home') {
                window.location.hash = '';
                renderHome();
            } else if (view === 'post') {
                window.location.hash = id;
                renderPost(id);
            } else if (view === 'page') {
                window.location.hash = id;
                renderPage(id);
            }
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                if (pages[hash]) {
                    renderPage(hash);
                } else {
                    renderPost(hash);
                }
            } else {
                renderHome();
            }
        });

        const initialHash = window.location.hash.replace('#', '');
        if (initialHash) {
            if (pages[initialHash]) {
                renderPage(initialHash);
            } else {
                renderPost(initialHash);
            }
        } else {
            renderHome();
        }
    </script>
</body>
</html>
